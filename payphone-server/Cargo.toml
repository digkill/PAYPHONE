[package]
name = "payphone-server"
version = "0.1.0"
edition = "2024"

[dependencies]
payphone-core = { path = "../payphone-core" }
payphone-transport = { path = "../payphone-transport" }

bytes = "1"
quinn = "0.11.11"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "signal",
    "sync"
] }