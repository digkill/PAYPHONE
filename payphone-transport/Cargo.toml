[package]
name = "payphone-transport"
version = "0.2.0"
edition = "2024"

[dependencies]
payphone-core = { path = "../payphone-core" }

quinn = { version = "0.11.11", features = [
    "runtime-tokio",
    "rustls-ring"
] }

rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
rcgen = "0.14"
bytes = "1"
sha2 = "0.11"

rand_core = {
    version = "0.9",
    features = [
        "os_rng"
    ]
}

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "io-util"
] }

tokio-rustls = "0.26"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
libcrux-ml-kem = { version = "0.0.10", default-features = false, features = ["mlkem768"] }
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring", "std"] }
rustls-acme = { version = "0.15.4", default-features = false, features = [
    "ring",
    "tokio",
    "tls12",
    "webpki-roots",
] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
