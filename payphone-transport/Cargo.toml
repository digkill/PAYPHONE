[package]
name = "payphone-transport"
version = "0.1.0"
edition = "2024"

[dependencies]
payphone-core = { path = "../payphone-core" }

quinn = { version = "0.11.11", features = [
    "runtime-tokio",
    "rustls-ring"
] }

rustls = "0.23"
rcgen = "0.14"
bytes = "1"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync"
] }