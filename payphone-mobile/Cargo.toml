[package]
name = "payphone-mobile"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
payphone-transport = { path = "../payphone-transport" }
bytes = "1"
quinn = "0.11.12"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
