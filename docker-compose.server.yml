# Server-only compose file for Coolify (or any host) deployment.
#
# Exists separately from docker-compose.yml because Coolify's own
# "Ports Mappings" UI/API field cannot express a UDP port — its
# validation only accepts bare TCP host:container pairs. A native
# docker-compose "ports:" entry with the /udp suffix is the only
# reliable way to get Coolify to actually publish a UDP port.
#
# Env vars (PAYPHONE_BIND_ADDR, PAYPHONE_OBFS_PSK, PAYPHONE_DEV_MODE)
# are injected by Coolify's own application environment settings,
# not hardcoded here.
#
# Host port defaults to 443 (same port real HTTP/3 uses) rather than
# a random high port, per the anti-fingerprinting plan: a sustained
# encrypted UDP flow to a non-standard port is itself a signal. The
# container keeps binding its usual internal 40404 (PAYPHONE_BIND_ADDR)
# — only the externally visible host port changes. This needs a host
# with nothing else already publishing 443/udp (e.g. Coolify's own
# Traefik proxy claims it by default for HTTP/3 — stop or reconfigure
# that first if it's in the way).
services:
  payphone-server:
    build:
      context: .
      target: server
    ports:
      - "${PAYPHONE_HOST_PORT:-443}:40404/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      # Keep the self-signed identity across redeploys so the
      # client pin in dev-certs/payphone-cert.der stays valid.
      - payphone-certs:/app/dev-certs
    restart: unless-stopped

volumes:
  payphone-certs:
