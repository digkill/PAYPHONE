# Apply on the Linux Docker HOST, then recreate the PAYPHONE container.
# Its docker-proxy UDP sockets inherit the host defaults, not Quinn's
# explicit socket settings inside the container. Capacity is used on demand.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304
