[package]
name = "payphone-client"
version = "0.2.0"
edition = "2024"

[dependencies]
payphone-core = {
    path = "../payphone-core"
}

payphone-transport = {
    path = "../payphone-transport"
}

payphone-tun = {
    path = "../payphone-tun"
}

bytes = "1"
quinn = "0.11.11"

tokio = {
    version = "1",
    features = [
        "rt-multi-thread",
        "macros",
        "net",
        "time",
        "signal",
        "sync"
    ]
}
chacha20poly1305 = "0.10"
sha2 = "0.11"
dotenvy = "0.15.7"

rand_core = {
    version = "0.9",
    features = [
        "os_rng"
    ]
}
